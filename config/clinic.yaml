# Флаги и списки для логики бота. Значения с TODO ждём от клиники.

# 04-11: «Антирабической вакцины в наличии нет» (выгрузка 18.08.2026). Оператор сверяет
# наличие по ссылке в реальном времени, у бота такого доступа нет.
# TODO: актуальное наличие вакцины и куда направлять за ней (в скрипте не указано).
rabies_vaccine_available: false

# Ответ клиники 13.11.2026: контрольный приём обычно назначают примерно через 10 дней,
# точный срок определяет врач. Бот предлагает время около этого дня.
control_visit_after_days: 10

# Возврат брошенной записи: если пациент начал запись и замолчал, бот один раз напоминает
# о ней. Ночью (по времени клиники) напоминание не отправляется — ни в это время, ни утром.
unfinished_booking:
  remind_after_minutes: 15
  quiet_hours: {start: "22:00", end: "08:00"}

# Травмы, о которых в скриптах клиники ничего нет (выгрузка 18.08.2026): бот не выбирает им
# сценарий, а говорит «Куда с этим обращаться, в моих данных нет» и предлагает передать вопрос
# администратору. Слова — целиком, все формы выписаны. Вопрос клинике — в
# docs/clinic_requests.md (куда направлять с выбитым или сломанным зубом).
no_route_words:
  - зуб
  - зуба
  - зубу
  - зубом
  - зубы
  - зубов
  - зубами

# «Это возможно?», «можно?», «получится?» сразу после просьбы — не отдельный вопрос, на
# который бот ищет ответ в справке (решение заказчика 15.11.2026). Предложение целиком,
# без «а», «и», «ну», «так» в начале.
plain_asks:
  - это возможно
  - возможно
  - возможно ли это
  - это можно
  - можно
  - можно так
  - получится
  - это получится
  - это реально
  - реально

# На шагах выбора дня и времени: «любое время», «всё равно», «выберите сами» — это кнопка
# «Ближайшее» (решение заказчика 15.11.2026). Фраза — в любом месте сообщения, если в нём не
# названы день, время или врач («всё равно, но только завтра вечером» — пожелание).
any_time:
  - любое время
  - в любое время
  - любое подойдет
  - любое свободное
  - все равно
  - без разницы
  - выберите сами
  - выбирайте сами
  - выбери сам
  - на ваш выбор
  - на ваше усмотрение
  - когда угодно

# После маршрута (решение заказчика 15.11.2026). Пока разговор идёт о травме, по которой
# дан маршрут, бот не говорит о нашем травмпункте — ни адрес, ни часы, ни документы, ни
# «принимаем», ни «записаться можно в этом чате»: пациент прочтёт это как «приезжайте к нам».
# Слова и фразы — целиком, как пишет пациент (без знаков препинания, «ё» как «е»).
after_route:
  # «вы меня запишете?», «к вам можно?» (в сообщении есть вопросительный знак) → «Нет, с этим
  # в травмпункт не записываем» и маршрут. Дополняет слова вопроса «меня примут?» в коде.
  taken:
    - к вам можно
    - к вам нельзя
    - к вам никак
    - к вам не попасть
    - не попасть
    - вы меня запишете
    - вы нас запишете
    - запишете меня
    - запишете нас
    - меня запишут
    - нас запишут
    - запишут меня
    - запишут нас
    - запишете или нет
    - запишут или нет
  # Вопрос о месте из маршрута (кроме его номера, названия и улицы — их бот берёт из данных
  # об учреждении): маршрут и «Как там принимают, у меня данных нет — уточните в самом
  # учреждении», а не «У меня нет этой информации».
  there:
    - это далеко
    - далеко ли
    - далеко от
    - далеко ехать
    - сколько ехать
    - как добраться
    - как доехать
    - как туда
    - что брать
    - что взять
    - с собой брать
    - с собой взять
    - что с собой
    - какие документы
    - документы какие
  # У маршрута нет адреса («Любой муниципальный травмпункт»), а пациент просит адрес: бот
  # говорит, что адресов в его данных нет, и не называет наш.
  address:
    - адрес
    - адреса
    - адресок
    - конкретно
    - конкретный
    - конкретнее
    - какой именно
    - куда именно
    - хоть один

# Слова о времени травмы, которые читает код, а не DeepSeek (решение заказчика 15.11.2026).
# Число и единица читаются в обоих порядках: «три года назад» и «года три назад».
# hours: [не меньше, не больше] — сколько часов назад это могло быть. Пороги вопроса «Когда
# была получена травма?» стоят в сценариях (to_hours / from_hours у вариантов ответа): 7 дней
# в 04-01, 04-05, 04-07, 04-11, сутки в 04-03 и 04-06. Слово, которое не отвечает на порог
# («вчера» для суток, «неделю назад» для 7 дней), означает: бот задаёт вопрос. То же, если
# слово расходится с ответом DeepSeek или в сообщении два времени с разными ответами.
# Слова — целиком, все формы выписаны. Пожелание о дне приёма («запишите на сегодня») временем
# травмы не считается: такую часть сообщения отсекает разбор пожеланий.
injury_time:
  words:
    - {phrases: ["сегодня"], hours: [0, 24]}
    - {phrases: ["только что"], hours: [0, 1]}
    - {phrases: ["утром"], hours: [0, 24]}
    - {phrases: ["вчера"], hours: [0, 48]}
    - {phrases: ["позавчера"], hours: [24, 72]}
    # Давность, которую называет сам пациент (решение заказчика 15.11.2026): заведомо больше
    # 7 дней. В сценарии первичной записи без вопроса о сроке (04-12, первичная перевязка
    # 04-02) такая травма не записывается молча — бот называет правило «не более 7 дней» из
    # скрипта 03-1 и предлагает передать вопрос администратору.
    - {phrases: ["в прошлом году", "прошлым летом", "прошлой зимой"], hours: [720, 17520]}
    - phrases: ["старая травма", "старой травмы", "старую травму", "старой травме",
                "старой травмой", "давняя травма", "давней травмы", "давнюю травму",
                "давней травмой", "старый перелом", "старого перелома", "старое растяжение",
                "старого растяжения"]
      hours: [720, 876000]
  # «N дней назад», «час назад», «неделю назад», «месяц назад»: число (цифрами или словом из
  # numbers) и единица. Первая форма единицы стоит и без числа: «день назад» — один день;
  # остальным формам число нужно: «несколько дней назад» код не читает. Допуск — одна
  # единица, но не больше суток: «7 дней назад» — от 6 до 8 дней, «5 часов назад» — от 4 до 6.
  units:
    - {forms: ["час", "часа", "часов"], hours: 1}
    - {forms: ["день", "дня", "дней"], hours: 24}
    - {forms: ["неделю", "недели", "недель"], hours: 168}
    - {forms: ["месяц", "месяца", "месяцев"], hours: 720}
    - {forms: ["год", "года", "лет"], hours: 8760}
  ago: "назад"
  numbers:
    один: 1
    одну: 1
    два: 2
    две: 2
    пару: 2
    три: 3
    четыре: 4
    пять: 5
    шесть: 6
    семь: 7
    восемь: 8
    девять: 9
    десять: 10

emergency:
  # Ответ без оценки состояния (решение заказчика 12.11.2026). Номер линии скорой клиники
  # (config/contacts.yaml, ambulance_line_phone) бот добавляет, когда клиника его даст.
  # С 14.11.2026 эта строка стоит в шаблонах «не могу давать рекомендации», в ответах после
  # маршрута и в исходе «скорая» сценария; на фразы из списка ниже бот отвечает строками
  # состояния «угроза жизни» (app/bot/texts.py, DANGER_*; docs/clinic_requests.md, п. 65).
  reply: "При угрозе жизни звоните 103 или 112."
  # Ответ клиники 13.11.2026: своего списка признаков угрозы жизни у клиники нет.
  # Временный список: признаки из 04-11 (падение давления, нарушение дыхания, потеря
  # сознания), сильное кровотечение из приёмочного теста 20 и очевидные признаки, добавленные
  # 14.11.2026 (дыхание, судороги, кость в ране, потеря чувствительности, удар током).
  # Весь список — на согласовании у клиники (docs/clinic_requests.md, п. 52). Одиночное слово
  # допустимо, только если оно не бывает обычной жалобой («задыхается» — да; «кровь», «боль»,
  # «посинел» — нет: палец синеет и от ушиба).
  phrases:
    - кровь не останавливается
    - кровь не остановить
    - не могу остановить кровь
    - не можем остановить кровь
    - кровотечение не останавливается
    - сильное кровотечение
    - кровь хлещет
    - хлещет кровь
    - потерял сознание
    - потеряла сознание
    - потерял сознанье
    - без сознания
    - не приходит в себя
    - не может дышать
    - не могу дышать
    - нечем дышать
    - трудно дышать
    - тяжело дышать
    - нарушение дыхания
    - упало давление
    - давление упало
    - падение давления
    - не дышит
    - перестал дышать
    - перестала дышать
    - задыхается
    - задыхаюсь
    - судороги
    - бьется в судорогах
    - синеет
    - синеют губы
    - посинели губы
    - посинело лицо
    - кость торчит
    - торчит кость
    - видна кость
    - видно кость
    - не чувствую ногу
    - не чувствую руку
    - не чувствует ногу
    - не чувствует руку
    - не чувствую ног
    - ударило током
    - удар током
    - ударил ток
    - поражение током
    - нет пульса
    - остановилось сердце

# Слова о самоубийстве или намерении навредить себе. Проверяются кодом до всего остального,
# как угроза жизни; второй уровень — флаг crisis от DeepSeek. Как клиника хочет обрабатывать
# такие сообщения — вопрос в docs/clinic_requests.md.
# Только намерение (будущее время, «хочу»), без прошедшего: «спрыгнул с крыши гаража» —
# это травма, а не кризис.
  # Состояние «угроза жизни» (решение заказчика 14.11.2026): фраза из списка выше включает
  # его на весь разговор — запись не начинается и не продолжается, пока пациент не нажмёт
  # «Меню» или не напишет, что признак прошёл.
  # Слова «признак прошёл» читает код. Правило (решение заказчика 14.11.2026): слова
  # пациента снимают состояние только после фраз о кровотечении (`after`); после любой
  # другой фразы списка — только «Меню» или /start, строка администратору остаётся.
  # «Кровь остановилась» не снимает «не дышит», сказанное в том же разговоре.
  # Вопрос о срочности (решение заказчика 15.11.2026): «скорую вызывать?», «ехать самой или
  # скорую?», «это срочно?», «это опасно?», «это серьёзно?». Бот отвечает шаблоном из кода, а
  # не ответом DeepSeek: «Оценить состояние я не могу. Если сомневаетесь или становится хуже
  # — звоните 103 или 112.» и, если в разговоре был дан маршрут, его адресом.
  # Фраза из двух слов и больше — вопрос, если в сообщении есть вопросительный знак или в
  # самой фразе стоит «ли» («опасно ли это»). Слово про скорую — вопрос и без знака, если
  # рядом есть «вызывать», «вызвать», «или», «надо», «нужно», «нужна»: «скорую надо или
  # самим ехать». «Вызову скорую тогда» и «как вызвать скорую?» — не вопрос о срочности.
  # «103» и «112» в сообщении с вопросительным знаком — тоже вопрос: «сразу 103, верно?».
  # Если в сообщении есть жалоба, шаблон идёт первой строкой, а дальше — обычный ход:
  # маршрут или шаг сценария (после маршрута шаблон по-прежнему идёт с его адресом).
  asks:
    - скорую
    - скорая
    - скорой
    - "103"
    - "112"
    - это срочно
    - это опасно
    - это не опасно
    - это серьезно
    - насколько срочно
    - насколько это срочно
    - насколько опасно
    - насколько это опасно
    - насколько серьезно
    - насколько это серьезно
    - серьезно ли
    - опасно ли
    - срочно ли
  # Скорая уже вызвана или уже была: взвешивать нечего, шаблон не говорится («скорую
  # вызвали, надо ли нам ехать самим?», «скорая приезжала, сказали идти в травмпункт»).
  ambulance_was:
    - вызвал
    - вызвала
    - вызвали
    - едет
    - приезжала
    - приехала
    - увезла
    - увезли
  # Намерение, а не вопрос: «я в скорую позвоню», «вызову скорую». Шаблон не говорится,
  # остальной вопрос сообщения получает ответ. Как и список выше, действует только рядом
  # со словом про скорую, «103» или «112».
  ambulance_will:
    - вызову
    - вызовем
    - позвоню
    - позвоним
    - наберу
  over:
    - after:
        - кровь не останавливается
        - кровь не остановить
        - не могу остановить кровь
        - не можем остановить кровь
        - кровотечение не останавливается
        - сильное кровотечение
        - кровь хлещет
        - хлещет кровь
      phrases:
        - кровь остановилась
        - кровотечение остановилось
        - кровь больше не идет
        - кровь уже не идет
        - уже не течет
        - больше не течет
        - ложная тревога
  # Фразы, для которых в скриптах есть адреса больниц: на «куда ехать?» бот называет их
  # (исход сценария для взрослого и для ребёнка), а не «адреса в моих данных нет».
  routes:
    - phrases: [кость торчит, торчит кость, видна кость, видно кость]
      scenario: fracture  # 04-07, открытый перелом
      adult: open_adult
      child: open_child

