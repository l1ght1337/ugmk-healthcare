# Флаги и списки для логики бота. Значения с TODO ждём от клиники.

# 04-11: «Антирабической вакцины в наличии нет» (выгрузка 18.08.2026). Оператор сверяет
# наличие по ссылке в реальном времени, у бота такого доступа нет.
# TODO: актуальное наличие вакцины и куда направлять за ней (в скрипте не указано).
rabies_vaccine_available: false

# Ответ клиники 13.11.2026: контрольный приём обычно назначают примерно через 10 дней,
# точный срок определяет врач. Бот предлагает время около этого дня.
control_visit_after_days: 10

# Возврат брошенной записи: если пациент начал запись и замолчал, бот один раз напоминает
# о ней. Ночью (по времени клиники) напоминание не отправляется — ни в это время, ни утром.
unfinished_booking:
  remind_after_minutes: 15
  quiet_hours: {start: "22:00", end: "08:00"}

emergency:
  # Ответ без оценки состояния (решение заказчика 12.11.2026). Номер линии скорой клиники
  # (config/contacts.yaml, ambulance_line_phone) бот добавляет, когда клиника его даст.
  reply: "При угрозе жизни звоните 103 или 112."
  # Ответ клиники 13.11.2026: своего списка признаков угрозы жизни у клиники нет.
  # Временный список: признаки из 04-11 (падение давления, нарушение дыхания, потеря
  # сознания), сильное кровотечение из приёмочного теста 20 и очевидные признаки, добавленные
  # 14.11.2026 (дыхание, судороги, кость в ране, потеря чувствительности, удар током).
  # Весь список — на согласовании у клиники (docs/clinic_requests.md, п. 52). Одиночное слово
  # допустимо, только если оно не бывает обычной жалобой («задыхается» — да; «кровь», «боль»,
  # «посинел» — нет: палец синеет и от ушиба).
  phrases:
    - кровь не останавливается
    - кровь не остановить
    - не могу остановить кровь
    - не можем остановить кровь
    - кровотечение не останавливается
    - сильное кровотечение
    - кровь хлещет
    - хлещет кровь
    - потерял сознание
    - потеряла сознание
    - потерял сознанье
    - без сознания
    - не приходит в себя
    - не может дышать
    - не могу дышать
    - нечем дышать
    - трудно дышать
    - тяжело дышать
    - нарушение дыхания
    - упало давление
    - давление упало
    - падение давления
    - не дышит
    - перестал дышать
    - перестала дышать
    - задыхается
    - задыхаюсь
    - судороги
    - бьется в судорогах
    - синеет
    - синеют губы
    - посинели губы
    - посинело лицо
    - кость торчит
    - торчит кость
    - видна кость
    - видно кость
    - не чувствую ногу
    - не чувствую руку
    - не чувствует ногу
    - не чувствует руку
    - не чувствую ног
    - ударило током
    - удар током
    - ударил ток
    - поражение током
    - нет пульса
    - остановилось сердце

# Слова о самоубийстве или намерении навредить себе. Проверяются кодом до всего остального,
# как угроза жизни; второй уровень — флаг crisis от DeepSeek. Как клиника хочет обрабатывать
# такие сообщения — вопрос в docs/clinic_requests.md.
# Только намерение (будущее время, «хочу»), без прошедшего: «спрыгнул с крыши гаража» —
# это травма, а не кризис.
crisis:
  phrases:
    - покончить с собой
    - покончу с собой
    - покончу жизнь самоубийством
    - убить себя
    - убью себя
    - убить себя хочу
    - наложить на себя руки
    - наложу на себя руки
    - свести счеты с жизнью
    - сведу счеты с жизнью
    - не хочу жить
    - жить не хочу
    - не хочется жить
    - жить не хочется
    - хочу умереть
    - хочу сдохнуть
    - спрыгну с крыши
    - прыгну с крыши
    - сброшусь с крыши
    - спрыгну с моста
    - прыгну с моста
    - выпрыгну из окна
    - выброшусь из окна
    - вскрою вены
    - вскрыть вены
    - перережу вены
    - порежу вены
    - наглотаюсь таблеток
    - выпью все таблетки
    - навредить себе
    - причинить себе вред
    - суицид
    - суицида
    - самоубийство
    - самоубийства
    - самоубийстве
