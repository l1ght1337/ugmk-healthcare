# Расписание травмпункта. Пока нет доступа к «Медиалогу», из этого файла строится
# демо-расписание data/schedule.csv (uv run python -m app.schedule.generate).

# Ответ клиники 13.11.2026: актуальный список врачей (все принимают и детей, и взрослых).
# Имена — как в скрипте 03-1.
doctors:
  - Кузнецов Николай Александрович
  - Ярунин Андрей Александрович
  - Билалов Руслан Фярисович
  - Деменков Денис Сергеевич

# 04-09: исключительное событие «Повторный приём» (в расписании выделено зелёным).
repeat_windows:
  - {start: "08:00", end: "10:00"}
  - {start: "16:00", end: "18:00"}

# Допущения демо-расписания. Смены — ответ клиники 13.11.2026: один врач дежурит
# 8:00–20:00, второй — 20:00–8:00; смены в демо чередуются между четырьмя врачами.
# TODO: длительность слота и часы кабинета «Травматолог 2» — от клиники.
demo:
  slot_minutes: 30
  main_cabinet: "Травматолог 1"          # круглосуточно, один врач в смене
  day_shift: {start: "08:00", end: "20:00"}
  repeat_cabinet: "Травматолог 2"        # 04-09: второй кабинет для повторных приёмов
  repeat_cabinet_hours: {start: "08:00", end: "20:00"}
  # Доля слотов, занятых «другими пациентами», по часам. Загрузка от клиники (13.11.2026):
  # около 90 обращений в день, до 15 в час, пик 8:00–11:00 (docs/clinic_load.md).
  busy_by_hour:
    - {start: "08:00", end: "11:00", share: 0.65}  # пик: 60–70 %
    - {start: "11:00", end: "17:00", share: 0.45}
    - {start: "17:00", end: "21:00", share: 0.35}
    - {start: "21:00", end: "23:00", share: 0.15}
    - {start: "23:00", end: "08:00", share: 0.05}  # ночь почти свободна
  days_ahead: 21                         # контрольный приём — примерно через 10 дней
  min_lead_minutes: 60                   # не предлагать слот, до которого меньше 60 минут (доехать)
