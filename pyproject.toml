[project]
name = "ugmk-healthcare"
version = "0.1.0"
description = "Test Telegram assistant for the UGMK-Zdorovye trauma centre"
requires-python = ">=3.12"
dependencies = [
    "aiogram>=3.31,<4",
    "aiosqlite>=0.22",
    "apscheduler>=3.11,<4",
    "openai>=3.49,<4",
    "pydantic>=2.13,<3",
    "pydantic-settings>=2.16,<3",
    "pyyaml>=6.0",
    "sqlalchemy[asyncio]>=2.1,<3",
    "tzdata>=2026.6",
]

[dependency-groups]
dev = [
    "pytest>=9",
    "pytest-asyncio>=1.4",
    "ruff>=0.17",
]

[tool.ruff]
line-length = 100
target-version = "py312"
# kb/ holds clinic source material; ruff also formats code blocks in Markdown, keep it off docs.
extend-exclude = ["kb", "*.md"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]
# Russian patient-facing text is full of Cyrillic letters that look like Latin ones.
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = ["live: calls the real DeepSeek API; run manually with `uv run pytest -m live`"]
addopts = "-m 'not live'"
